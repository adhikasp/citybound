[package]
name = "cb_browser_ui"
version = "0.3.0"
authors = ["Anselm Eickhoff <anselm.eickhoff@gmail.com>"]
license = "AGPL-3.0"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
js-sys = "0.3"
serde-wasm-bindgen = "0.6"
web-sys = { version = "0.3", features = ["Window", "Location"] }
serde = "1.0"
serde_json = "1.0"
serde_derive = "1.0"
compact_macros = "0.1.0"
kay = {version = "0.5.1", default-features = false, features = ["browser"]}
cb_util = {path = "../cb_util"}
cb_time = {path = "../cb_time"}
cb_planning = {path = "../cb_planning"}

[dependencies.cb_simulation]
path = "../cb_simulation"
default-features = false

[build-dependencies]
kay_codegen = {version = "0.3.10", features = ["serde-serialization"]}

[profile.release]
debug = true

[patch.crates-io]
kay = { path = "../vendor/kay" }
chunky = { path = "../vendor/chunky" }
# Same fix as the server's root Cargo.toml: the crates.io `compact` hands out a
# misaligned empty slice (undefined behaviour). Both halves must use the
# patched one.
compact = { path = "../vendor/compact" }
