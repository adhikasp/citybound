[package]
name = "citybound"
version = "0.3.0"
authors = ["Anselm Eickhoff <anselm.eickhoff@gmail.com>"]
license = "AGPL-3.0"

[workspace]
members = [
    "./cb_simulation",
    "./cb_planning",
    "./cb_util",
    "./cb_time",
]
exclude = [
    "./cb_browser_ui"
]

[[bin]]
name = "citybound"
path = "./cb_server/main.rs"

[dependencies]
rouille = {version = "2.1.0", default-features = false}
clap = "2.32.0"
backtrace = "0.3"
rust-embed-flag = {git = "https://github.com/aeickhoff/rust-embed", rev = "3f1ce67f01884d895d0d522d32481232a64481df"}
ctrlc = "3.1.3"

[dependencies.cb_simulation]
path = "./cb_simulation"

[profile.dev]
# opt-level = 1
codegen-units = 4

[profile.release]
debug = true
codegen-units = 4

[features]
embed_assets = ["rust-embed-flag/embed_assets"]
# Kernel crates of the simulation (kay, chunky) were published in 2020 and use
# nightly features that have since been removed or changed. They are vendored
# under vendor/ with minimal fixes so the project builds on a current nightly.
[patch.crates-io]
kay = { path = "vendor/kay" }
chunky = { path = "vendor/chunky" }
# Patched: an empty CompactVec handed out a misaligned (0x1) zero-length slice,
# which is UB and made sleeper queues read back as garbage under rustc 1.102.
compact = { path = "vendor/compact" }